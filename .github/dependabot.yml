# Actualizaciones de dependencias (10-security-and-operations.md §2). Un PR por grupo cada semana; los de seguridad
# llegan en cuanto se publica el aviso. Cada PR pasa por el CI (incluidas las E2E) antes de integrarse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Mexico_City }
    open-pull-requests-limit: 5
    groups:
      npm-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Mexico_City }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Mexico_City }
