name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: Dependencias de producción sin vulnerabilidades altas conocidas
        run: pnpm audit --prod --audit-level high
      - name: Tipos de la API al día con el contrato fijado
        run: pnpm api:check
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas unitarias
        run: pnpm test
      - name: Navegador para E2E
        # Si apt no alcanza los espejos de Ubuntu (pasó el 11/11/2026), se instala solo el navegador: la imagen del
        # runner ya trae casi todas sus dependencias; si faltara alguna, Chromium falla al arrancar con un error claro.
        run: |
          pnpm exec playwright install --with-deps chromium || {
            echo "::warning::No se pudieron instalar las dependencias del sistema; se instala solo Chromium."
            pnpm exec playwright install chromium
          }
      - name: Build y E2E (incluye accesibilidad)
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Web + API real + PostgreSQL desechable (scripts/e2e-real.sh). La API se compila en el commit que fija
  # velora.contractRef: el contrato con el que se generan los tipos y la API que se prueba son siempre los mismos.
  e2e-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Commit de la API fijado en el contrato
        id: api
        run: echo "ref=$(node -p "require('./package.json').velora.contractRef")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: 1franky/velora-api
          ref: ${{ steps.api.outputs.ref }}
          path: .velora-api
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: Navegador para E2E
        # Si apt no alcanza los espejos de Ubuntu (pasó el 11/11/2026), se instala solo el navegador: la imagen del
        # runner ya trae casi todas sus dependencias; si faltara alguna, Chromium falla al arrancar con un error claro.
        run: |
          pnpm exec playwright install --with-deps chromium || {
            echo "::warning::No se pudieron instalar las dependencias del sistema; se instala solo Chromium."
            pnpm exec playwright install chromium
          }
      - name: E2E contra la API real
        run: pnpm e2e:real
        env:
          VELORA_API_DIR: .velora-api
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-real
          path: playwright-report-real
          retention-days: 7

  imagen:
    # La imagen que se despliega arranca y sirve /login con sus encabezados. Las E2E corren sobre el repositorio
    # completo y no lo detectan: el 12/11/2026 la imagen no incluía un módulo que importa next.config.ts y la web cayó.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen de producción
        run: docker build -t velora-web:ci .
      - name: Arrancarla y revisar /login
        run: |
          docker run -d --name web -p 127.0.0.1:3000:3000 -e VELORA_API_URL=http://127.0.0.1:9 velora-web:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          docker logs web
          [ "$code" = 200 ] || { echo "::error::La imagen no sirve /login (código $code)"; exit 1; }
          curl -sI http://127.0.0.1:3000/login | grep -qi '^content-security-policy:' \
            || { echo "::error::La imagen no envía los encabezados de seguridad"; exit 1; }
