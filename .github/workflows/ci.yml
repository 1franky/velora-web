name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: Tipos de la API al día con el contrato fijado
        run: pnpm api:check
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas unitarias
        run: pnpm test
      - name: Navegador para E2E
        run: pnpm exec playwright install --with-deps chromium
      - name: Build y E2E (incluye accesibilidad)
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
